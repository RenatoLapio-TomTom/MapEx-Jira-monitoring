name: Jira Weekly Monitoring
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: "Weeks to backfill (e.g. 2026-W28,2026-W29) — leave empty for current week"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests matplotlib numpy

      - name: Collect Jira data
        env:
          JIRA_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_weeks }}" ]; then
            python scripts/collect_jira_data.py --back
