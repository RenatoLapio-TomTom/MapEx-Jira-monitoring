name: Jira Weekly Monitoring
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: "Weeks to backfill (e.g. 2026-W28,2026-W29) — leave empty for current week"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect Jira data
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_weeks }}" ]; then
            python scripts/collect_jira_data.py --backfill "${{ github.event.inputs.backfill_weeks }}"
          else
            python scripts/collect_jira_data.py
          fi

      - name: Update Confluence pages
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.JIRA_BASE_URL }}/wiki
          CONFLUENCE_EMAIL: ${{ secrets.JIRA_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/update_confluence.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_snapshots.csv data/latest_snapshot.json
          git diff --staged --quiet || git commit -m "Weekly Jira snapshot - $(date +'%Y-W%V')"
          git push
